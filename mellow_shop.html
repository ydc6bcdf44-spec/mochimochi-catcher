let state={cash:50000,cart:[],fav:[],orders:[]};try{state=JSON.parse(localStorage.getItem('mellowGameV1'))||state}catch(e){}let page='home',cat='ワンホン',id=0,size='',sort='new',search='',pay='カード決済';const m=document.getElementById('main'),yen=n=>'¥'+n.toLocaleString('ja-JP'),total=()=>state.cart.reduce((s,p)=>s+goods[p.id][1]*p.qty,0),ship=()=>total()>=8000||!total()?0:550;const save=()=>{try{localStorage.setItem('mellowGameV1',JSON.stringify(state))}catch(e){}};function notify(t){let a=document.getElementById('toast');a.textContent=t;a.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>a.style.display='none',1800)}function photo(i){return `<img src="${goods[i][3]}" alt="${goods[i][0]}" onerror="this.onerror=null;this.src='${U('photo-1441986300917-64674bd600d8')}';this.alt='代替イメージ'">`}function card(i){let p=goods[i];return `<article><div class="photo"><button data-item="${i}">${photo(i)}</button><button class="heart" data-fav="${i}">${state.fav.includes(i)?'♥':'♡'}</button></div><div class="info"><span class="tag">NEW</span><br>${p[0]}<br><span class="price">${yen(p[1])}</span><br><span class="muted">税込 / 在庫あり</span></div></article>`}function render(){document.getElementById('wallet').textContent=yen(state.cash);document.getElementById('count').textContent=state.cart.reduce((s,p)=>s+p.qty,0);if(page==='home'){let ids=goods.map((_,i)=>i).filter(i=>(cat==='ALL'||goods[i][2]===cat)&&goods[i][0].includes(search));if(sort==='low')ids.sort((a,b)=>goods[a][1]-goods[b][1]);if(sort==='high')ids.sort((a,b)=>goods[b][1]-goods[a][1]);m.innerHTML=`<nav>${['ALL','ワンホン','服','バッグ','コスメ','アクセ','靴'].map(x=>`<button data-cat="${x}" class="${cat===x?'on':''}">${x}</button>`).join('')}</nav>${cat==='ALL'&&!search?`<div class="hero"><img src="${U('photo-1483985988355-763728e1935b')}"><div><small>WANGHONG COLLECTION</small><h1>Sweet &amp;<br>Glamorous.</h1>今日の私に、ときめくものを。</div></div>`:''}<div class="section"><h2>${cat==='ワンホン'?'Wanghong Edit':'New arrivals'}</h2><select id="sort"><option value="new">新着順</option><option value="low" ${sort==='low'?'selected':''}>価格が安い順</option><option value="high" ${sort==='high'?'selected':''}>価格が高い順</option></select></div><form id="search"><input name="q" placeholder="商品を検索" value=""><button class="link">検索</button></form><p class="muted">${ids.length} items</p><div class="grid">${ids.map(card).join('')}</div>`}if(page==='fav')m.innerHTML=`<div class="section"><h2>Wishlist</h2></div><div class="grid">${state.fav.map(card).join('')||'お気に入りはまだありません。'}</div>`;if(page==='detail'){let p=goods[id];m.innerHTML=`<button class="link" data-go="home">‹ 商品一覧</button><div class="panel detail">${photo(id)}<div><small class="muted">mellow. selection</small><h2>${p[0]}</h2><p class="price">${yen(p[1])}</p><p class="muted">税込 / 在庫あり / 2〜4日でお届け</p><label>サイズ</label><select id="size"><option value="">選択してください</option>${(['服','ワンホン'].includes(p[2])?['S','M','L']:p[2]==='靴'?['22.5','23.0','23.5','24.0','24.5']:['FREE']).map(s=>`<option ${s===size?'selected':''}>${s}</option>`).join('')}</select><button class="primary" data-add="1" ${!size?'disabled':''}>カートに入れる</button><button class="outline" data-fav="${id}">${state.fav.includes(id)?'♥ お気に入り登録済み':'♡ お気に入りに追加'}</button><p class="muted">※写真は参考画像です。商品名・価格・在庫はゲーム内の設定です。</p></div></div>`}if(page==='cart'||page==='checkout'){m.innerHTML=`<div class="panel"><h2>${page==='cart'?'Shopping bag':'Checkout'}</h2>${state.cart.map((p,k)=>`<div class="line">${photo(p.id)}<div style="flex:1">${goods[p.id][0]}<br><span class="muted">${p.size}</span><br>${yen(goods[p.id][1])}<br><button data-minus="${k}">−</button> ${p.qty} <button data-plus="${k}">＋</button></div><button data-del="${k}">×</button></div>`).join('')||'<p>カートは空です。</p>'}<p class="row">商品小計 <b>${yen(total())}</b></p><p class="row">送料 <b>${yen(ship())}</b></p><hr><p class="row">お支払い合計 <b>${yen(total()+ship())}</b></p>${page==='checkout'?`<div class="box">配送先：マイホーム（架空住所）<br>配送方法：通常配送</div><label>支払い方法</label><select id="pay">${['カード決済','電子マネー','代金引換'].map(x=>`<option ${x===pay?'selected':''}>${x}</option>`).join('')}</select>`:''}<button class="primary" data-go="${page==='cart'?'checkout':'buy'}" ${!total()||total()+ship()>state.cash?'disabled':''}>${page==='cart'?'購入手続きへ':'注文を確定する'}</button>${total()+ship()>state.cash?'<p>残高が不足しています。</p>':''}<button class="outline" data-go="home">買い物を続ける</button></div>`}if(page==='orders')m.innerHTML=`<div class="panel"><h2>My orders</h2>${state.orders.map((o,k)=>`<div class="box"><div class="row"><b>ORDER #${o.no}</b><span class="tag">${['発送準備中','配送中','到着済み','開封済み'][o.status]}</span></div>${o.status===3?'<div class="package">✧</div>':''}${o.items.map(p=>`<div class="line">${photo(p.id)}<div>${goods[p.id][0]}<br>${p.size} × ${p.qty}</div></div>`).join('')}<p>${yen(o.cost)} / ${o.pay}</p>${o.status<3?`<button class="primary" data-delivery="${k}">${['発送する','荷物を受け取る','箱を開封する'][o.status]}</button>`:'<p>受け取り・開封完了！</p>'}</div>`).join('')||'<p>注文履歴はありません。</p>'}</div>`;save()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(!Object.keys(d).length)return;let old=page;if(d.go){if(d.go==='buy'){let cost=total()+ship();if(cost<=state.cash&&state.cart.length){state.cash-=cost;state.orders.unshift({no:String(Date.now()).slice(-8),items:state.cart,cost,pay,status:0});state.cart=[];page='orders';notify('ご注文ありがとうございます！')}}else if(d.go==='reset'){if(confirm('購入履歴と残高をリセットしますか？')){state={cash:50000,cart:[],fav:[],orders:[]};page='home';cat='ALL';search=''}}else page=d.go}if(d.cat){cat=d.cat;search='';page='home'}if(d.item!==undefined){id=+d.item;size='';page='detail'}if(d.fav!==undefined){let n=+d.fav;state.fav=state.fav.includes(n)?state.fav.filter(x=>x!==n):[...state.fav,n]}if(d.add&&size){let p=state.cart.find(p=>p.id===id&&p.size===size);if(p)p.qty++;else state.cart.push({id,size,qty:1});notify('カートに追加しました')}if(d.minus!==undefined){let n=+d.minus;if(--state.cart[n].qty===0)state.cart.splice(n,1)}if(d.plus!==undefined)state.cart[+d.plus].qty++;if(d.del!==undefined)state.cart.splice(+d.del,1);if(d.delivery!==undefined){state.orders[+d.delivery].status++;notify('配送状況を更新しました')}render();if(old!==page)window.scrollTo(0,0)});document.addEventListener('change',e=>{if(e.target.id==='size'){size=e.target.value;render()}if(e.target.id==='sort'){sort=e.target.value;render()}if(e.target.id==='pay')pay=e.target.value});document.addEventListener('submit',e=>{if(e.target.id==='search'){e.preventDefault();search=new FormData(e.target).get('q');render()}});render();</script></body></html>
